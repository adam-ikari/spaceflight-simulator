<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>航天项目模拟器</title>
    <link rel="icon" href="data:," />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05070f;
        color: #e8eaed;
        font: 13px/1.4 system-ui, sans-serif;
      }
      #scene { position: fixed; inset: 0; }
      #scene canvas { display: block; }
      #telemetry { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
      #side { position: fixed; top: 12px; right: 12px; width: 280px; z-index: 3; }
      #side summary, #telemetry summary { cursor: pointer; color: #8ab4f8; }
      #designer-panel {
        background: rgba(15, 20, 30, .88);
        border: 1px solid #303642;
        border-radius: 6px;
        padding: .6rem .7rem;
      }
      #designer-panel[open] { max-height: calc(100vh - 96px); overflow: auto; }
      .hud-top {
        position: absolute;
        top: 12px;
        left: 12px;
        right: 304px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: .5rem .75rem;
        background: rgba(10, 14, 22, .86);
        border: 1px solid #303642;
        border-radius: 6px;
        backdrop-filter: blur(6px);
      }
      .hud-brand { font-weight: 700; color: #8ab4f8; white-space: nowrap; }
      .phase-track { display: flex; flex: 1; gap: 4px; min-width: 0; }
      .phase-step {
        flex: 1;
        padding: .25rem .15rem;
        text-align: center;
        color: #7f8794;
        border-radius: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .phase-step.done { color: #8ab4f8; }
      .phase-step.active { background: #8ab4f8; color: #07101c; font-weight: 700; }
      .hud-clock { font-variant-numeric: tabular-nums; white-space: nowrap; }
      .metric-grid {
        position: absolute;
        top: 76px;
        left: 12px;
        display: grid;
        grid-template-columns: repeat(2, 142px);
        gap: 6px;
      }
      .metric-card {
        padding: .45rem .6rem;
        background: rgba(10, 14, 22, .82);
        border: 1px solid #303642;
        border-left: 2px solid #8ab4f8;
        border-radius: 5px;
      }
      .metric-card span { display: block; color: #9aa0a6; font-size: 11px; }
      .metric-card b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
      .hud-detail {
        position: absolute;
        right: 12px;
        bottom: 60px;
        width: 280px;
        max-height: 52vh;
        overflow: auto;
        pointer-events: auto;
        background: rgba(10, 14, 22, .9);
        border: 1px solid #303642;
        border-radius: 6px;
        padding: .55rem .7rem;
      }
      .hud-detail[open] { padding-bottom: .8rem; }
      .detail-section { margin-top: .5rem; border-top: 1px solid #303642; padding-top: .4rem; font-weight: 600; }
      .detail-row { display: flex; justify-content: space-between; gap: .5rem; font-weight: 400; }
      #controls {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 4;
        display: flex;
        gap: .4rem;
        align-items: center;
      }
      #controls label { display: flex; align-items: center; gap: .25rem; }
      #controls button, #controls select {
        font: inherit;
        padding: .3rem .55rem;
        border: 1px solid #3c4043;
        border-radius: 4px;
        background: #1b1f24;
        color: #e8eaed;
        cursor: pointer;
      }
      #controls button:hover, #controls select:hover { border-color: #8ab4f8; }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: #05070f;
        color: #8ab4f8;
        font: 600 16px/1.4 system-ui, sans-serif;
        letter-spacing: .08em;
      }
      #start-overlay {
        position: fixed;
        inset: 0;
        z-index: 8;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 40%, #10192b 0%, #05070f 70%);
      }
      .start-card {
        width: min(520px, calc(100vw - 32px));
        padding: 2rem;
        text-align: center;
        background: rgba(12, 17, 27, .92);
        border: 1px solid #3c5a86;
        border-radius: 10px;
      }
      .start-tag { color: #8ab4f8; letter-spacing: .35em; font-weight: 700; }
      .start-card h1 { margin: .6rem 0 1rem; font-size: 30px; }
      .start-card p { color: #b8c1cc; margin: .35rem 0; }
      .start-crew { font-size: 12px; color: #7f8794 !important; }
      #start {
        margin-top: 1.5rem;
        padding: .7rem 2.2rem;
        font: 600 16px/1 system-ui, sans-serif;
        color: #07101c;
        background: #8ab4f8;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }
      #start:hover { background: #a8c8ff; }
    </style>
  </head>
  <body>
    <div id="loading">正在加载航天模拟器…</div>
    <div id="start-overlay">
      <div class="start-card">
        <div class="start-tag">APOLLO 11</div>
        <h1>载人登月任务</h1>
        <p>土星五号运载火箭 · 阿波罗指令/服务舱 · 登月舱</p>
        <p class="start-crew">阿姆斯特朗 · 奥尔德林 · 柯林斯</p>
        <button id="start" type="button">开始播放</button>
      </div>
    </div>
    <div id="scene"></div>
    <div id="telemetry"></div>
    <div id="controls">
      <label for="view">视角
        <select id="view">
          <option value="control" selected>指挥室视角</option>
          <option value="orbit">轨道视角</option>
          <option value="chase">追尾视角</option>
          <option value="ground">地面视角</option>
          <option value="cockpit">舱内视角</option>
          <option value="overview">总览视角</option>
        </select>
      </label>
      <label for="warp">倍速
        <select id="warp">
          <option value="1">1×</option>
          <option value="10" selected>10×</option>
          <option value="50">50×</option>
        </select>
      </label>
      <button id="pause" type="button">暂停</button>
      <button id="replay" type="button">重播</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
