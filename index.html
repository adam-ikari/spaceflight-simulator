<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gotothemoon</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070f;
        color: #e8eaed;
        font: 13px/1.4 system-ui, sans-serif;
      }
      #app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        grid-template-rows: minmax(0, 1fr) auto;
        height: 100vh;
      }
      #scene {
        grid-row: 1 / 3;
        min-height: 0;
        min-width: 0;
      }
      #scene canvas {
        display: block;
      }
      #side {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 0.75rem;
        overflow: auto;
        min-height: 0;
      }
      #controls {
        position: fixed;
        left: 0.75rem;
        bottom: 0.75rem;
        display: flex;
        gap: 0.5rem;
      }
      #controls button {
        font: inherit;
        padding: 0.4rem 0.9rem;
        border: 1px solid #3c4043;
        border-radius: 4px;
        background: #1b1f24;
        color: #e8eaed;
        cursor: pointer;
      }
      #controls button:hover {
        border-color: #8ab4f8;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="scene"></div>
      <div id="side">
        <div id="designer"></div>
        <div id="telemetry"></div>
      </div>
    </div>
    <div id="controls">
      <label for="view" style="display:flex;align-items:center;gap:.3rem">视角
        <select id="view">
          <option value="orbit">轨道视角</option>
          <option value="chase">追尾视角</option>
          <option value="ground">地面视角</option>
          <option value="cockpit">舱内视角</option>
          <option value="overview">总览视角</option>
        </select>
      </label>
      <button id="launch" type="button">发射</button>
      <button id="abort" type="button">中止</button>
      <button id="deorbit" type="button">离轨</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
