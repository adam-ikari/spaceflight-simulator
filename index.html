<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gotothemoon</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070f;
        color: #e8eaed;
        font: 13px/1.4 system-ui, sans-serif;
      }
      #app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        grid-template-rows: minmax(0, 1fr) auto;
        height: 100vh;
      }
      #scene {
        grid-row: 1 / 3;
        min-height: 0;
        min-width: 0;
      }
      #scene canvas {
        display: block;
      }
      #side {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 0.75rem;
        overflow: auto;
        min-height: 0;
      }
      #controls {
        position: fixed;
        left: 0.75rem;
        bottom: 0.75rem;
        display: flex;
        gap: 0.5rem;
      }
      #controls button {
        font: inherit;
        padding: 0.4rem 0.9rem;
        border: 1px solid #3c4043;
        border-radius: 4px;
        background: #1b1f24;
        color: #e8eaed;
        cursor: pointer;
      }
      #controls button:hover {
        border-color: #8ab4f8;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="scene"></div>
      <div id="side">
        <div id="designer"></div>
        <div id="telemetry"></div>
      </div>
    </div>
    <div id="controls">
      <button id="launch" type="button">Launch</button>
      <button id="abort" type="button">Abort</button>
      <button id="deorbit" type="button">Deorbit</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
