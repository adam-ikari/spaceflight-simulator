<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>航天项目模拟器</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070f;
        color: #e8eaed;
        font: 13px/1.4 system-ui, sans-serif;
      }
      #app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        grid-template-rows: minmax(0, 1fr) auto;
        height: 100vh;
      }
      #scene {
        grid-row: 1 / 3;
        min-height: 0;
        min-width: 0;
      }
      #scene canvas {
        display: block;
      }
      #side {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 0.75rem;
        overflow: auto;
        min-height: 0;
      }
      #controls {
        position: fixed;
        left: 0.75rem;
        bottom: 0.75rem;
        display: flex;
        gap: 0.5rem;
      }
      #controls button {
        font: inherit;
        padding: 0.4rem 0.9rem;
        border: 1px solid #3c4043;
        border-radius: 4px;
        background: #1b1f24;
        color: #e8eaed;
        cursor: pointer;
      }
      #controls button:hover {
        border-color: #8ab4f8;
      }
      #controls select {
        font: inherit;
        padding: 0.25rem 0.4rem;
        border: 1px solid #3c4043;
        border-radius: 4px;
        background: #1b1f24;
        color: #e8eaed;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: #05070f;
        color: #8ab4f8;
        font: 600 16px/1.4 system-ui, sans-serif;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <div id="loading">正在加载航天模拟器…</div>
    <div id="app">
      <div id="scene"></div>
      <div id="side">
        <div id="brand" style="font:600 16px/1.4 system-ui,sans-serif;letter-spacing:.04em;color:#8ab4f8">
          航天项目模拟器
        </div>
        <div id="telemetry"></div>
        <details id="designer-panel">
          <summary style="cursor:pointer;color:#8ab4f8">火箭设计器</summary>
          <div id="designer"></div>
        </details>
      </div>
    </div>
    <div id="controls">
      <label for="mission" style="display:flex;align-items:center;gap:.3rem">任务
        <select id="mission">
          <option value="leo" selected>近地轨道</option>
          <option value="lunar">载人登月</option>
        </select>
      </label>
      <label for="view" style="display:flex;align-items:center;gap:.3rem">视角
        <select id="view">
          <option value="control" selected>指挥室视角</option>
          <option value="orbit">轨道视角</option>
          <option value="chase">追尾视角</option>
          <option value="ground">地面视角</option>
          <option value="cockpit">舱内视角</option>
          <option value="overview">总览视角</option>
        </select>
      </label>
      <label for="warp" style="display:flex;align-items:center;gap:.3rem">倍速
        <select id="warp">
          <option value="1">1×</option>
          <option value="10" selected>10×</option>
          <option value="50">50×</option>
        </select>
      </label>
      <button id="pause" type="button">暂停</button>
      <button id="replay" type="button">重播</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
